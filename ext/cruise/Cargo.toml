[package]
name = "cruise"
version = "0.2.1"
edition = "2021"
authors = ["Marco Roth <marco.roth@intergga.ch>"]
description = "A fast, OS-native file watcher for Ruby"
license = "MIT"
publish = false

[lib]
name = "cruise"
path = "src/lib.rs"
crate-type = ["staticlib"]

[dependencies]
notify = { version = "7", features = ["macos_fsevent"] }
notify-debouncer-full = "0.4"
globset = "0.4"
libc = "0.2"

[build-dependencies]
cbindgen = "0.28"
