name: Build

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    name: Ruby ${{ matrix.ruby }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '3.2'
          - '3.3'
          - '3.4'
          - '4.0'
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Compile Native Extension
        run: bundle exec rake compile

      - name: Run tests
        run: bundle exec rake test

      - name: Check sig/ matches the inline annotations
        run: |
          bundle exec rake rbs
          git diff --exit-code sig/ || {
            echo "::error::sig/ is out of date. Run: bundle exec rake rbs"
            exit 1
          }

      - name: Install RBS collection
        run: bundle exec rbs collection install

      - name: Validate RBS
        run: bundle exec rbs --repo .gem_rbs_collection -I sig validate

      - name: Run Steep
        run: bundle exec steep check
